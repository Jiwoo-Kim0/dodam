plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    // FCM 푸시(S15P21D105-580). 서비스 계정 키는 FCM_SERVICE_ACCOUNT_PATH로 주입한다.
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트 클래스마다 Spring 컨텍스트가 캐시되어(50개 이상) 기본 힙(512MB)에서는 OutOfMemoryError로 컨텍스트 로딩이 실패한다.
    maxHeapSize = '2g'
    // Spring TestContext 캐시 기본 상한은 32다. 상한을 넘으면 LRU로 컨텍스트를 닫는데,
    // 닫히는 컨텍스트의 `ddl-auto: create-drop`이 H2 인메모리 DB의 스키마를 드롭한다.
    // 그 DB(`jdbc:h2:mem:dodam`)를 공유하는 다른 캐시 컨텍스트들은 그때부터 전부
    // "Table ... not found"로 실패한다 — 새로 추가한 테스트가 아니라 무관한 테스트가 깨지므로
    // 원인을 찾기 어렵다. 실제로 2026-09-16에 컨텍스트가 33개가 되면서 98건이 이렇게 깨졌다.
    // 컨텍스트 수가 64에 가까워지면 힙과 함께 다시 올려야 한다.
    systemProperty 'spring.test.context.cache.maxSize', '64'
}
