spring:
  application:
    name: dodam-backend
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt:
      issuer: dodam
      access-token-validity: PT30M
      refresh-token-validity: P14D
  ssafy-finance:
    base-url: https://finopenapi.ssafy.io
    connect-timeout: PT3S
    read-timeout: PT5S
  social:
    # 소셜 로그인(backend/docs/auth-social.md). 서버는 클라이언트가 받은 토큰을 공급자에 검증만 하므로 client secret은 필요 없다.
    kakao:
      user-info-url: https://kapi.kakao.com/v2/user/me
      token-info-url: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID:}          # 카카오 개발자 콘솔 앱 ID(숫자). 비어 있으면 "우리 앱에서 발급된 토큰인지" 검사를 생략한다
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      client-ids: ${GOOGLE_CLIENT_ID:}  # ID token의 aud로 허용할 OAuth 클라이언트 ID. 쉼표로 여러 개(Android·웹). 비어 있으면 구글 로그인 불가
    connect-timeout: PT3S
    read-timeout: PT5S
  ai:
    # API 21 AI 코치(backend/docs/ai-coach.md). 서버가 계산한 값을 문장으로 옮기는 용도로만 쓴다.
    # api-key가 비어 있으면 호출하지 않고 템플릿 응답으로 내려간다(기동은 정상) — 값은 프로필별로 준다.
    enabled: true
    base-url: https://api.openai.com
    chat-path: /v1/chat/completions
    model: gpt-4o-mini            # max_tokens 파라미터를 받는 모델이어야 한다(o-시리즈는 파라미터명이 다르다)
    temperature: 0.2              # 같은 사실에서 매번 다른 문장이 나오면 검증도 재현도 어렵다
    max-tokens: 600
    max-attempts: 2               # 429·5xx·네트워크 오류일 때만 재시도한다(401·400은 즉시 포기)
    connect-timeout: PT3S
    read-timeout: PT12S           # 사용자가 화면에서 기다리는 동기 호출이다

  pattern:
    # API 3 패턴 분석 정책값. 명세·기획안에 수치가 없는 항목의 서비스 기본안(backend/docs/pattern.md).
    lookback-months: 6          # 분석 기간(완료된 달 기준)
    min-user-months: 3          # 군집 비교에 필요한 사용자 데이터 최소 개월(기획안 노출 조건)
    min-population: 30          # 군집 모델 학습 최소 사용자 수
    min-cluster-sample-size: 10 # 배정 군집 최소 표본 수
    min-confidence: 0.2         # 분류 신뢰도 하한
    cluster-count: 4            # K-Means 군집 수
    model-ttl: PT1H             # 인프로세스 학습 모델 메모리 재사용 시간
    lease-duration: PT5M        # 진행 중 접수 유효 시간
    # Python 학습 스크립트(backend/ml/pattern/train_cluster_model.py)가 만든 모델 아티팩트. 없으면 train-in-process에 따라 Java 학습 또는 RULE_ONLY.
    model-location: classpath:ml/spending-kmeans-v1.json
    train-in-process: true
  notification:
    push:
      enabled: false            # FCM 발송. prod에서만 true (FCM_SERVICE_ACCOUNT_PATH 마운트 필요)
      service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
    events:
      enabled: true             # 이벤트 스케줄(결제·상환 예정, 현금흐름 위험, 목표, 추천, 리포트, 브리핑)
      due-days-ahead: 3
      risk-days-ahead: 7
      recommendation-days-back: 7
