spring:
  application:
    name: dodam-backend
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt:
      issuer: dodam
      access-token-validity: PT30M
      refresh-token-validity: P14D
