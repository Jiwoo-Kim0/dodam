spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:dodam;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

management:
  health:
    redis:
      enabled: false

app:
  security:
    number-hash-key: dodam-test-number-hash-key
  cors:
    allowed-origins:
      - http://localhost:3000
    allow-credentials: true
