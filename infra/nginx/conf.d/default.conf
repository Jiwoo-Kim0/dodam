# conf.d/*.conf는 nginx.conf의 http 블록 안에 include되므로
# limit_req_zone 같은 http 컨텍스트 지시어를 여기에 둘 수 있다.

# 응답 헤더/에러 페이지에서 nginx 버전 숨김
server_tokens off;

# Docker 임베디드 DNS. proxy_pass에 변수를 쓰면 nginx가 호스트명을
# "기동 시점"이 아니라 "요청 시점"에 해석한다.
# 이렇게 해두지 않으면 backend나 jenkins가 내려가 있을 때
# nginx 자체가 기동에 실패해서 장애가 전체로 번진다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 일반 API: 초당 20req (버스트 40)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
# 인증 관련: 분당 10req — 무차별 대입 방어 (해당 엔드포인트는 아직 미구현, 미리 걸어둠)
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

server {
    listen 80;
    server_name j15D105.p.ssafy.io _;

    # Let's Encrypt 갱신용 — HTTPS 리다이렉트보다 먼저 와야 한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 헬스체크는 리다이렉트에서 제외한다.
    # deploy.sh와 컨테이너 헬스체크가 내부 네트워크에서 http://nginx/api/health를 호출하는데,
    # 301이 오면 배포 검증이 실패한다. 노출되는 정보는 {"status":"UP"} 뿐이라 위험이 없다.
    location = /api/health {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name j15D105.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15d105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15d105.p.ssafy.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 보안 헤더
    # HSTS는 일단 1일로 짧게 둔다 — 12일짜리 프로젝트에서 443이 막히는 상황이 오면
    # 긴 max-age가 팀원 브라우저를 HTTP로 못 돌아가게 묶어버리기 때문.
    # 운영이 안정되면 31536000(1년)으로 올릴 것.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Actuator는 외부에 절대 노출하지 않는다.
    # (Day 6에서 Prometheus가 수집할 때는 컨테이너 네트워크로 backend:8080에 직접 접근)
    location ^~ /actuator/ {
        return 404;
    }

    # ── Jenkins ────────────────────────────────────────────────────────────
    # Jenkins 컨테이너는 docker.sock 접근권을 가지므로, 뚫리면 호스트 루트가 넘어간다.
    # 따라서 GitLab 웹훅 수신 경로만 공개하고 UI는 외부에 열지 않는다.
    # UI 접근: ssh -L 8080:127.0.0.1:8080 ssafy-ec2  →  http://localhost:8080/jenkins/
    # 상세 근거: infra/todo/security.md R1
    location ^~ /jenkins/project/ {
        set $upstream_jenkins http://jenkins:8080;
        proxy_pass $upstream_jenkins;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 10m;
    }

    location ^~ /jenkins/ {
        return 403;
    }

    # ── 백엔드 API ─────────────────────────────────────────────────────────
    # 인증 경로는 더 엄격한 레이트 리밋 (일반 규칙보다 먼저 매칭되어야 함)
    location ^~ /api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;

        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        client_max_body_size 20m;
    }

    # ── Grafana (Day 6) ────────────────────────────────────────────────
    # Grafana는 자체 로그인이 있고 docker.sock 접근권도 없으므로 Jenkins와 달리 공개한다.
    # 다만 익명 접근과 회원가입은 컨테이너 환경변수에서 막아뒀다.
    location ^~ /grafana/ {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live(실시간 패널)가 WebSocket을 쓴다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    # Day 7에서 FE 웹 정적 빌드를 서빙할지 결정 (app.json의 web.output: static)
    location / {
        return 200 "dodam infra: nginx up (https)\n";
        add_header Content-Type text/plain;
    }
}
