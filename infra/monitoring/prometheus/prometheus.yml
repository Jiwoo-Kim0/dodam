# Prometheus 수집 설정
#
# 수집 대상은 전부 컨테이너 네트워크(app-net) 안에서만 접근한다.
# 외부에 노출되는 것은 nginx의 /grafana/ 뿐이고, Prometheus 자체 UI는 열지 않는다.
# (Jenkins와 같은 이유 — 노출면을 줄인다. infra/todo/security.md R1 참고)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: dodam

scrape_configs:
  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 호스트 리소스 (CPU / 메모리 / 디스크 / 네트워크)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: ec2-host

  # 컨테이너별 리소스 수집은 제외했다.
  #
  # cAdvisor(v0.49.1, v0.52.1 모두)가 Docker 29의 overlayfs 스토리지 드라이버를
  # 지원하지 않아 "failed to identify the read-write layer ID"로 컨테이너 객체 생성에
  # 실패하고, name 라벨이 붙은 메트릭이 하나도 나오지 않았다.
  # 데이터를 내놓지 못하는 수집기를 남겨두면 대시보드가 빈 채로 유지되고
  # "모니터링이 되고 있다"는 착각만 남으므로 제거했다.
  #
  # 대신 컨테이너 이상 감지는 infra/scripts/container-watch.sh가 담당한다.
  # (docker에 직접 물어 정지/unhealthy/크래시 루프를 감지하고 Mattermost로 알림)

  # 백엔드 애플리케이션 메트릭 (JVM 힙/GC, HTTP 요청 등)
  #
  # ⚠️ 선행 조건 — 백엔드팀 작업이 필요하다 (2026-09-09 기준 미충족):
  #   1) build.gradle에 io.micrometer:micrometer-registry-prometheus 추가
  #   2) application.yml의 management.endpoints.web.exposure.include에 prometheus 추가
  #      (현재 health만 노출되어 있어 /actuator/prometheus가 404)
  # 조건이 갖춰지기 전에는 이 job이 계속 DOWN으로 뜨는데, 그 자체가
  # "아직 준비 안 됨"을 드러내므로 일부러 남겨둔다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # 부하 테스트(693) 병목 규명용. 앱 지표로는 "DB가 느리다"까지만 알 수 있고
  # 슬로우 쿼리·락 대기·eviction 같은 서버 내부 원인은 여기서만 보인다.
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: dodam-backend
