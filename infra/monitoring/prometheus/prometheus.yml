# Prometheus 수집 설정
#
# 수집 대상은 전부 컨테이너 네트워크(app-net) 안에서만 접근한다.
# 외부에 노출되는 것은 nginx의 /grafana/ 뿐이고, Prometheus 자체 UI는 열지 않는다.
# (Jenkins와 같은 이유 — 노출면을 줄인다. infra/todo/security.md R1 참고)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: dodam

scrape_configs:
  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 호스트 리소스 (CPU / 메모리 / 디스크 / 네트워크)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: ec2-host

  # 컨테이너별 리소스
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # 백엔드 애플리케이션 메트릭 (JVM 힙/GC, HTTP 요청 등)
  #
  # ⚠️ 선행 조건 — 백엔드팀 작업이 필요하다 (2026-09-09 기준 미충족):
  #   1) build.gradle에 io.micrometer:micrometer-registry-prometheus 추가
  #   2) application.yml의 management.endpoints.web.exposure.include에 prometheus 추가
  #      (현재 health만 노출되어 있어 /actuator/prometheus가 404)
  # 조건이 갖춰지기 전에는 이 job이 계속 DOWN으로 뜨는데, 그 자체가
  # "아직 준비 안 됨"을 드러내므로 일부러 남겨둔다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: dodam-backend
