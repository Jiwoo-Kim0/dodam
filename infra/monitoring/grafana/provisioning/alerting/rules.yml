# 알림 규칙 프로비저닝.
#
# 규칙 선정 기준: "이게 울리면 사람이 반드시 뭔가 해야 하는가?"
# 그렇지 않은 지표는 대시보드로만 보고 알림으로 만들지 않는다.
# 울려도 아무도 행동하지 않는 알림이 쌓이면 진짜 알림까지 무시하게 된다.
apiVersion: 1

groups:
  - orgId: 1
    name: dodam-infra
    folder: 도담
    interval: 1m
    rules:
      # ── 서비스/컨테이너 다운 ────────────────────────────────────────
      # backend job은 의도적으로 제외한다.
      # micrometer 의존성과 actuator 노출, SecurityConfig 허용이 아직 안 되어 있어
      # /actuator/prometheus가 401을 반환하고, up=0이 상시 유지된다.
      # 늘 켜져 있는 알림은 사람들이 무시하게 되어 진짜 알림까지 묻히므로,
      # 백엔드 선행작업이 끝나면 이 제외 조건을 풀 것.
      - uid: dodam-target-down
        title: 수집 대상 다운
        condition: threshold
        for: 3m          # 재시작 중 잠깐 끊기는 것으로 울리지 않게 유예
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) 이(가) 3분 이상 응답하지 않습니다"
        labels:
          severity: critical
        data:
          - refId: query
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job!="backend"}
              instant: true
              refId: query
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: query
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: threshold
        noDataState: NoData
        execErrState: Alerting

      # ── 디스크 임계치 ──────────────────────────────────────────────
      - uid: dodam-disk-low
        title: 디스크 여유 부족
        condition: threshold
        for: 10m
        annotations:
          summary: "루트 파티션 여유 공간이 15% 미만입니다. 백업/로그 정리가 필요합니다"
        labels:
          severity: warning
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: node_filesystem_avail_bytes{mountpoint="/",fstype="ext4"} / node_filesystem_size_bytes{mountpoint="/",fstype="ext4"} * 100
              instant: true
              refId: query
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: query
              conditions:
                - evaluator: { type: lt, params: [15] }
              refId: threshold
        # node-exporter가 죽으면 이 쿼리는 NoData가 되는데, 그 상황은
        # "수집 대상 다운" 규칙이 이미 알려준다. NoData로도 알림을 보내면
        # 컴포넌트 하나가 죽었을 때 알림이 3개 오게 되어 소음이 된다.
        noDataState: OK
        execErrState: Alerting

      # ── 메모리 임계치 ──────────────────────────────────────────────
      - uid: dodam-memory-low
        title: 호스트 메모리 부족
        condition: threshold
        for: 10m
        annotations:
          summary: "가용 메모리가 10% 미만입니다. 컨테이너 OOM 위험이 있습니다"
        labels:
          severity: warning
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100
              instant: true
              refId: query
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: query
              conditions:
                - evaluator: { type: lt, params: [10] }
              refId: threshold
        # node-exporter가 죽으면 이 쿼리는 NoData가 되는데, 그 상황은
        # "수집 대상 다운" 규칙이 이미 알려준다. NoData로도 알림을 보내면
        # 컴포넌트 하나가 죽었을 때 알림이 3개 오게 되어 소음이 된다.
        noDataState: OK
        execErrState: Alerting
