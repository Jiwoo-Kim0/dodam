# 알림 채널(Contact point) 프로비저닝.
# webhook URL은 파일에 직접 쓰지 않고 컨테이너 환경변수로 주입한다.
# Grafana 프로비저닝은 $__env{} 문법으로 환경변수를 읽을 수 있다.
#
# ── type을 slack으로 둔 이유 (2026-09-09 실측) ──────────────────────────
# 처음에는 type: webhook 으로 만들고 message 템플릿에 {"text": ...} 형태를 넣었는데,
# Grafana 테스트 발송 결과 `webhook response status 400 Bad Request` 로 실패했다.
#
# 원인: Grafana의 webhook 타입은 message를 본문 전체로 쓰지 않고,
#       자체 JSON 구조({"receiver":..., "status":..., "alerts":[...], "message":...})를 보낸다.
#       Mattermost의 Incoming Webhook은 최상위에 text가 있어야 하므로 400을 반환한다.
#
# 해결: Mattermost는 Slack 호환 페이로드를 받아준다.
#       Grafana의 slack 타입은 {"text": ..., "attachments": [...]} 를 보내므로 그대로 동작한다.
#       (url 자리에 Mattermost Incoming Webhook URL을 그대로 넣으면 된다)
#
# 이 문제는 "설정했다"에서 멈췄으면 알 수 없었다.
# 알림은 채널까지 실제로 도달하는지 테스트 발송으로 확인해야 한다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: mattermost
    receivers:
      - uid: mattermost-webhook
        type: slack
        settings:
          url: $__env{MATTERMOST_WEBHOOK_URL}
          title: |
            {{ if eq .Status "firing" }}:rotating_light: [발생]{{ else }}:white_check_mark: [해제]{{ end }} 도담 인프라 알림
          text: |
            {{ range .Alerts }}
            - **{{ .Labels.alertname }}**{{ if .Annotations.summary }} — {{ .Annotations.summary }}{{ end }}
            {{ end }}

policies:
  - orgId: 1
    receiver: mattermost
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    # 같은 알림을 4시간마다 다시 보낸다. 너무 자주 보내면 무시하게 되고,
    # 너무 뜸하면 잊어버린다.
    repeat_interval: 4h
