# Grafana 데이터소스 자동 프로비저닝
# UI에서 수동으로 붙이면 컨테이너를 다시 만들 때 사라지므로 파일로 관리한다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
