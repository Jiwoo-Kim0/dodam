# Promtail — 호스트의 Docker 컨테이너 로그를 수집해 Loki로 보낸다.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 데몬에서 컨테이너 목록과 로그를 직접 읽는다.
  # (파일 경로를 직접 훑는 방식보다 컨테이너 이름 라벨이 정확하게 붙는다)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # 컨테이너 이름 앞의 / 를 떼어 container 라벨로 사용
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
